<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upcoming Event - FX-13 Valour</title>
    <link rel="icon" type="image/png" href="/Images/Robotics Club Logo.png" />

    <style>
      /* Interactive Background Canvas */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        /* Allows clicks to pass through */
      }

      /* --- Global Reset & Variables --- */
      :root {
        --electric-blue: #007bff;
        --matte-black: #0d0d0d;
        --deep-charcoal: #161616;
        --off-white: #e8e8e8;
        --transition-smooth: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      body {
        background-color: var(--matte-black);
        color: var(--off-white);
        font-family: "Inter", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      /* --- Main Container --- */
      #container {
        background: var(--deep-charcoal);
        max-width: 600px;
        width: 100%;
        padding: 50px;
        border-radius: 20px;
        border: 1px solid rgba(0, 123, 255, 0.2);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }

      /* --- Event Heading --- */
      #eventName {
        font-size: 1.2rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--electric-blue);
        margin-bottom: 15px;
      }

      #eventName span {
        color: var(--off-white);
        font-size: 2.2rem;
        display: block; /* Moves the name to a new line */
        margin-top: 5px;
      }

      /* --- 'For' tag styling: minimalistic pill for audience --- */
      #eventFor {
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--electric-blue);
        margin: 8px 0 18px 0;
        font-weight: 700;
      }

      #eventFor span {
        display: inline-block;
        margin-left: 10px;
        background: rgba(0, 123, 255, 0.08);
        color: var(--off-white);
        padding: 4px 10px;
        border-radius: 20px; /* pill */
        font-weight: 600;
        font-size: 0.85rem;
        border: 1px solid var(--electric-blue);
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.03);
        transition: var(--transition-smooth);
      }

      #eventFor span:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 123, 255, 0.08);
      }

      #eventdes {
        font-size: 0.95rem;
        line-height: 1.7;
        opacity: 0.7;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* --- Metadata (Date, Time, Type) --- */
      #eventDate,
      #eventTime,
      #eventType {
        font-size: 0.9rem;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--electric-blue);
        margin: 10px 0;
      }

      #eventDate span,
      #eventTime span,
      #eventType span {
        color: var(--off-white);
        font-weight: 400;
        margin-left: 10px;
        font-family:
          "Courier New", monospace; /* Monospace for technical data */
      }

      /* --- Zoom Link Container (The "Secure" Box) --- */
      #eventLinkContainer {
        background: rgba(0, 123, 255, 0.05);
        border: 1px dashed var(--electric-blue);
        padding: 25px;
        border-radius: 12px;
        margin-top: 30px;
      }

      #eventLinkContainer p {
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        margin: 12px 0;
        color: var(--off-white);
      }

      #eventLinkContainer a {
        color: var(--electric-blue);
        word-break: break-all; /* Prevents long links from breaking the layout */
        text-decoration: none;
        transition: var(--transition-smooth);
      }

      #eventLinkContainer a:hover {
        text-shadow: 0 0 10px var(--electric-blue);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Interactive Background :DDD -->
    <canvas id="bg-canvas"></canvas>

    <div id="container">
      <p id="eventName">Event Name: <span>COMING SOON</span></p>
      <p id="eventFor">For: <span>To be released</span></p>
      <p id="eventdes">
        Stay tuned for updates!
      </p>
      <p id="eventDate">Date: <span>To be released.</span></p>
      <p id="eventTime">Time: <span>To be released.</span></p>
      <p id="eventType">Type: <span>To be released.</span></p>

      <div id="eventLinkContainer">
 
      </div>
    </div>

    <!-- Button to go back to homepage -->
    <style>
      /* Button styles for homepage event participate */
      #Go-Back-to-Homepage-Button {
        margin-top: 40px;
        position: relative;
        background: transparent;
        color: var(--electric-blue);
        text-transform: uppercase;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 2px;
        padding: 16px 35px;
        border: 1px solid var(--electric-blue);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        overflow: hidden;
        z-index: 1;
        display: inline-block;
      }

      #Go-Back-to-Homepage-Button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--electric-blue);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: -1;
      }

      #Go-Back-to-Homepage-Button:hover {
        color: var(--matte-black);
        box-shadow: 0 0 25px rgba(0, 123, 255, 0.5);
        transform: translateY(-2px);
      }

      #Go-Back-to-Homepage-Button:hover::before {
        left: 0;
      }

      #Go-Back-to-Homepage-Button:active {
        transform: scale(0.98);
      }

      @keyframes neonPulse {
        0% {
          box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
        }
        100% {
          box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }
      }

      #Go-Back-to-Homepage-Button:hover {
        animation: neonPulse 2s infinite ease-in-out;
      }

      /* Responsive adjustments for smaller screens */
      @media (max-width: 600px) {
        #Go-Back-to-Homepage-Button {
          display: block;
          width: calc(100% - 40px);
          max-width: 360px;
          margin: 24px auto 0 auto;
          padding: 12px 20px;
          font-size: 0.9rem;
          letter-spacing: 1px;
        }

        #Go-Back-to-Homepage-Button::before {
          left: -120%;
        }
      }
    </style>

    <button
      id="Go-Back-to-Homepage-Button"
      onclick="window.location.href = '/'"
    >
      Go Back to Homepage
    </button>

    <!-- Interactive Particles Background Script -->

    <script>
      // --- Interactive Star Particle Background ---
      const canvas = document.getElementById("bg-canvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        let width, height;
        let particles = [];

        // Mouse interaction W
        const mouse = { x: null, y: null, radius: 150 };

        window.addEventListener("mousemove", (event) => {
          mouse.x = event.x;
          mouse.y = event.y;
        });

        window.addEventListener("mouseout", () => {
          mouse.x = null;
          mouse.y = null;
        });

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
          initParticles();
        }
        window.addEventListener("resize", resize);

        class Particle {
          constructor(x, y, dx, dy, size) {
            this.x = x;
            this.y = y;
            this.dx = dx;
            this.dy = dy;
            this.size = size;
          }
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            // Stars are off-white/blue shaded
            ctx.fillStyle = "rgba(232, 232, 232, 0.8)";
            ctx.fill();
          }
          update() {
            if (this.x > width || this.x < 0) this.dx = -this.dx;
            if (this.y > height || this.y < 0) this.dy = -this.dy;

            // Interaction with mouse (repel slightly)
            if (mouse.x != null && mouse.y != null) {
              let dx = mouse.x - this.x;
              let dy = mouse.y - this.y;
              let distance = Math.sqrt(dx * dx + dy * dy);
              if (distance < mouse.radius) {
                const forceDirectionX = dx / distance;
                const forceDirectionY = dy / distance;
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= forceDirectionX * force * 1.5;
                this.y -= forceDirectionY * force * 1.5;
              }
            }

            this.x += this.dx;
            this.y += this.dy;
            this.draw();
          }
        }

        function initParticles() {
          particles = [];
          // Adjust density: lower divisor = more particles so its better haha
          let numberOfParticles = (width * height) / 9000;
          for (let i = 0; i < numberOfParticles; i++) {
            let size = Math.random() * 1.5 + 0.5; // tiny stars
            let x = Math.random() * (width - size * 2) + size * 2;
            let y = Math.random() * (height - size * 2) + size * 2;
            let dx = (Math.random() - 0.5) * 0.5; // slow drift
            let dy = (Math.random() - 0.5) * 0.5;
            particles.push(new Particle(x, y, dx, dy, size));
          }
        }

        function animateParticles() {
          requestAnimationFrame(animateParticles);
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            particles[i].update();
          }
          connectParticles();
        }

        function connectParticles() {
          let maxDistance = 100;
          for (let a = 0; a < particles.length; a++) {
            for (let b = a; b < particles.length; b++) {
              let dx = particles[a].x - particles[b].x;
              let dy = particles[a].y - particles[b].y;
              let distance = dx * dx + dy * dy;

              // Connect particles to each other
              if (distance < maxDistance * maxDistance) {
                let opacity = 1 - distance / (maxDistance * maxDistance);
                ctx.strokeStyle = `rgba(232, 232, 232, ${opacity * 0.15})`; // VERY faint web
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
              }
            }
            // Mouse connection: "shit appear when u hover over the web"
            if (mouse.x != null && mouse.y != null) {
              let dx = particles[a].x - mouse.x;
              let dy = particles[a].y - mouse.y;
              let distance = dx * dx + dy * dy;
              if (distance < mouse.radius * mouse.radius) {
                let opacity = 1 - distance / (mouse.radius * mouse.radius);
                // Electric blue lines shoot out to the cursor like Woosh
                ctx.strokeStyle = `rgba(0, 123, 255, ${opacity * 0.9})`;
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.stroke();
              }
            }
          }
        }

        resize();
        animateParticles();
      }
    </script>
  </body>
</html>
