<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upcoming Event - FX-13 Valour</title>
    <link rel="icon" type="image/png" href="/Images/Robotics Club Logo.png" />
    <link rel="stylesheet" href="CSS/motion.css" />

    <style>
      /* Interactive Background Canvas */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        /* Allows clicks to pass through */
      }

      /* --- Global Reset & Variables --- */
      :root {
        --electric-blue: #007bff;
        --matte-black: #0d0d0d;
        --deep-charcoal: #161616;
        --off-white: #e8e8e8;
        --transition-smooth: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        background-color: var(--matte-black);
        color: var(--off-white);
        font-family: "Inter", sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      /* --- Main Container --- */
      #container {
        background: var(--deep-charcoal);
        max-width: 600px;
        width: 100%;
        padding: 50px;
        border-radius: 20px;
        border: 1px solid rgba(0, 123, 255, 0.2);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
        animation: fx-pop 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* Details appear one after another */
      #container > * {
        animation: fx-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #container > :nth-child(2) { animation-delay: 0.12s; }
      #container > :nth-child(3) { animation-delay: 0.18s; }
      #container > :nth-child(4) { animation-delay: 0.24s; }
      #container > :nth-child(5) { animation-delay: 0.3s; }
      #container > :nth-child(6) { animation-delay: 0.36s; }
      #container > :nth-child(7) { animation-delay: 0.42s; }

      /* Thin scanning line across the top of the card */
      #container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--electric-blue), transparent);
        animation: scanLine 3.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes scanLine {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }

      @media (max-width: 600px) {
        #container {
          padding: 36px 22px;
        }
        #eventName span {
          font-size: 1.7rem;
        }
        #eventDate span,
        #eventTime span,
        #eventType span {
          display: inline-block;
        }
      }

      /* --- Event Heading --- */
      #eventName {
        font-size: 1.2rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--electric-blue);
        margin-bottom: 15px;
      }

      #eventName span {
        color: var(--off-white);
        font-size: 2.2rem;
        display: block; /* Moves the name to a new line */
        margin-top: 5px;
      }

      /* --- 'For' tag styling: minimalistic pill for audience --- */
      #eventFor {
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--electric-blue);
        margin: 8px 0 18px 0;
        font-weight: 700;
      }

      #eventFor span {
        display: inline-block;
        margin-left: 10px;
        background: rgba(0, 123, 255, 0.08);
        color: var(--off-white);
        padding: 4px 10px;
        border-radius: 20px; /* pill */
        font-weight: 600;
        font-size: 0.85rem;
        border: 1px solid var(--electric-blue);
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.03);
        transition: var(--transition-smooth);
      }

      #eventFor span:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 123, 255, 0.08);
      }

      #eventdes {
        font-size: 0.95rem;
        line-height: 1.7;
        opacity: 0.7;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* --- Metadata (Date, Time, Type) --- */
      #eventDate,
      #eventTime,
      #eventType {
        font-size: 0.9rem;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--electric-blue);
        margin: 10px 0;
      }

      #eventDate span,
      #eventTime span,
      #eventType span {
        color: var(--off-white);
        font-weight: 400;
        margin-left: 10px;
        font-family:
          "Courier New", monospace; /* Monospace for technical data */
      }

      /* --- Zoom Link Container (The "Secure" Box) --- */
      #eventLinkContainer:empty {
        display: none;
      }

      #eventLinkContainer {
        background: rgba(0, 123, 255, 0.05);
        border: 1px dashed var(--electric-blue);
        padding: 25px;
        border-radius: 12px;
        margin-top: 30px;
      }

      #eventLinkContainer p {
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        margin: 12px 0;
        color: var(--off-white);
      }

      #eventLinkContainer a {
        color: var(--electric-blue);
        word-break: break-all; /* Prevents long links from breaking the layout */
        text-decoration: none;
        transition: var(--transition-smooth);
      }

      #eventLinkContainer a:hover {
        text-shadow: 0 0 10px var(--electric-blue);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Interactive Background :DDD -->
    <canvas id="bg-canvas"></canvas>

    <div id="container">
      <p id="eventName">Event Name: <span>COMING SOON</span></p>
      <p id="eventFor">For: <span>To be released</span></p>
      <p id="eventdes">
        Stay tuned for updates!
      </p>
      <p id="eventDate">Date: <span>To be released.</span></p>
      <p id="eventTime">Time: <span>To be released.</span></p>
      <p id="eventType">Type: <span>To be released.</span></p>

      <div id="eventLinkContainer"></div>
    </div>

    <!-- Button to go back to homepage -->
    <style>
      /* Button styles for homepage event participate */
      #Go-Back-to-Homepage-Button {
        margin-top: 40px;
        position: relative;
        background: transparent;
        color: var(--electric-blue);
        text-transform: uppercase;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 2px;
        padding: 16px 35px;
        border: 1px solid var(--electric-blue);
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        transition:
          color 0.4s ease,
          box-shadow 0.4s ease,
          transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        z-index: 1;
        display: inline-block;
        animation: fx-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s backwards;
      }

      #Go-Back-to-Homepage-Button::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        transform: translateX(-101%);
        width: 100%;
        height: 100%;
        background: var(--electric-blue);
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: -1;
      }

      #Go-Back-to-Homepage-Button:hover {
        color: var(--matte-black);
        box-shadow: 0 0 25px rgba(0, 123, 255, 0.5);
        transform: translateY(-2px);
      }

      #Go-Back-to-Homepage-Button:hover::before {
        transform: translateX(0);
      }

      #Go-Back-to-Homepage-Button:active {
        transform: scale(0.98);
      }

      @keyframes neonPulse {
        0% {
          box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
        }
        100% {
          box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }
      }



      /* Responsive adjustments for smaller screens */
      @media (max-width: 600px) {
        #Go-Back-to-Homepage-Button {
          display: block;
          width: 100%;
          max-width: 360px;
          margin: 24px auto 0 auto;
          padding: 12px 20px;
          font-size: 0.9rem;
          letter-spacing: 1px;
        }


      }
    </style>

    <button
      id="Go-Back-to-Homepage-Button"
      type="button"
      onclick="window.location.href = '/'"
    >
      Go Back to Homepage
    </button>

    <!-- Interactive Particles Background Script -->
    <script defer src="particles.js"></script>
  </body>
</html>
