<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - FX-13 Valour</title>
    <link rel="stylesheet" href="/CSS/main.css" />
    <link rel="stylesheet" href="/CSS/motion.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="icon" type="image/png" href="/Images/Robotics Club Logo.png" />
    <style>
      /* Essential Canvas Reset */
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #050508; /* Fallback deep space dark color */
      }

      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none; /* Allows clicks to pass through to elements below */
      }

      .all-sections {
        position: relative;
        z-index: 1; /* Pushes content above canvas layer */
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
      }

      .contact-title {
        margin-bottom: 2rem;
        color: white;
        font-family: "Inter", "Segoe UI", sans-serif;
        font-size: 2.5rem;
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }

      .contact-box {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 40px 80px;
        text-align: center;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        transition:
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.4s ease,
          box-shadow 0.5s ease;
        animation: fx-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        box-shadow:
          0 0 10px rgba(255, 255, 255, 0.05),
          inset 0 0 5px rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
        text-decoration: none;
        box-sizing: border-box;
      }

      .contact-title {
        animation: fx-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .email-box {
        animation-delay: 0.1s;
        width: 100%;
        max-width: 480px;
        padding: 40px 40px;
      }

      .back-box {
        animation-delay: 0.2s;
        margin-top: 1.5rem;
        padding: 20px 50px;
        width: 100%;
        max-width: 300px;
      }

      @media (hover: hover) {
        .contact-box:hover {
          transform: translateY(-4px);
          border-color: rgba(255, 255, 255, 0.4);
          box-shadow:
            0 0 20px rgba(255, 255, 255, 0.15),
            inset 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .email-box:hover .contact-icon {
          transform: scale(1.08) rotate(-6deg);
          color: #fff;
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
      }

      .contact-box:active {
        transform: scale(0.98);
        transition: transform 0.1s ease;
      }

      .contact-icon {
        font-size: 3rem;
        color: #fff;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        transition:
          transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1),
          color 0.4s ease,
          text-shadow 0.4s ease;
      }

      @media (hover: hover) {
        .back-box:hover .back-icon {
          transform: translateX(-4px);
        }
      }

      .back-icon {
        font-size: 1.8rem;
      }

      .contact-email {
        color: white;
        font-size: 1.0rem;
        font-weight: bold;
        font-family: monospace;
        letter-spacing: 1px;
        margin: 0;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        word-break: break-all;
      }

      .back-text {
        color: white;
        font-size: 1.1rem;
        font-weight: bold;
        font-family: monospace;
        letter-spacing: 1px;
        margin: 0;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
      }

      /* Responsive Breakpoints */
      @media (max-width: 600px) {
        .contact-title {
          font-size: 2rem;
          margin-bottom: 1.5rem;
        }
        .contact-box {
          padding: 30px 20px;
          gap: 12px;
        }
        .contact-email {
          font-size: 1rem;
        }
        .back-box {
          padding: 15px 30px;
          margin-top: 1rem;
        }
        .back-text {
          font-size: 1rem;
        }
        .contact-icon {
          font-size: 2.2rem;
        }
        .back-icon {
          font-size: 1.4rem;
        }
      }

      @media (max-width: 360px) {
        .contact-email {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="bg-canvas"></canvas>

    <section class="all-sections">
      <h1 class="contact-title">Contact Us</h1>

      <a
        href="https://mail.google.com/mail/?view=cm&to=fxvalourwebsite@gmail.com"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-box email-box"
      >
        <i class="fa-solid fa-envelope contact-icon"></i>
        <p class="contact-email">fx13valourrobotics@gmail.com</p>
      </a>

      <a href="index.html" class="contact-box back-box">
        <i class="fa-solid fa-arrow-left contact-icon back-icon"></i>
        <p class="back-text">Back to Home</p>
      </a>
    </section>

    <script defer src="particles.js"></script>
  </body>
</html>
