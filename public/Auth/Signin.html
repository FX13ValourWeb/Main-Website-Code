<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Sign In - FX-13 Valour</title>
     <link rel="icon" type="image/png" href="/Images/Robotics Club Logo.png"> 
     <style>
          /* --- Global Theme Integration --- */
:root {
    --electric-blue: #007BFF;
    --matte-black: #0d0d0d;
    --deep-charcoal: #161616;
    --off-white: #e8e8e8;
    --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
}

body {
    background-color: var(--matte-black);
    color: var(--off-white);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* --- Selection Container --- */
#container {
    background: var(--deep-charcoal);
    padding: 60px 40px;
    border: 1px solid rgba(0, 123, 255, 0.15);
    border-radius: 20px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    position: relative;
    box-sizing: border-box;
    animation: auth-pop 0.8s var(--ease-out) both;
}

#container > * {
    animation: auth-enter 0.7s var(--ease-out) both;
}
#container > :nth-child(2) { animation-delay: 0.12s; }
#container > :nth-child(3) { animation-delay: 0.2s; }

/* Decorative Scanner Line */
#container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    height: 2px;
    background: var(--electric-blue);
    box-shadow: 0 0 15px var(--electric-blue);
    animation: scanPulse 2.8s ease-in-out infinite;
}

@keyframes scanPulse {
    0%, 100% { width: 30%; opacity: 0.7; }
    50% { width: 50%; opacity: 1; }
}

#text {
    font-size: 0.9rem;
    letter-spacing: 4px;
    font-weight: 700;
    color: var(--off-white);
    margin-bottom: 40px;
    opacity: 0.8;
    text-transform: uppercase;
}

/* --- Action Buttons --- */
.btn {
    display: block;
    box-sizing: border-box;
    text-decoration: none;
    width: 100%;
    background: transparent;
    border: 1px solid rgba(0, 123, 255, 0.3);
    margin: 15px 0;
    padding: 0; /* Important: padding moves to the inner <span> */
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.btn span {
    display: block;
    padding: 20px;
    color: var(--off-white);
    text-decoration: none;
    text-transform: uppercase;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    position: relative;
    z-index: 2;
    transition: var(--transition);
}

/* Hover Fill Effect */
.btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--electric-blue);
    transition: transform 0.5s var(--ease-out);
    transform: translateX(-101%);
    z-index: 1;
}

.btn:hover {
    border-color: var(--electric-blue);
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0, 123, 255, 0.2);
}

.btn:hover::after {
    transform: translateX(0);
}

.btn:hover span {
    color: var(--matte-black);
}

/* Active State */
.btn:active {
    transform: translateY(-1px) scale(0.99);
}

@media (max-width: 480px) {
    #container {
        padding: 50px 22px 60px;
    }
    #text {
        letter-spacing: 2.5px;
    }
    .btn span {
        padding: 18px 12px;
        letter-spacing: 1.5px;
    }
}

/* Bottom Label */
#container::after {
    content: "FX-13 SECURITY PROTOCOL";
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    font-size: 0.6rem;
    letter-spacing: 3px;
    opacity: 0.3;
    color: var(--electric-blue);
}
     </style>
     <link rel="stylesheet" href="auth.css">
</head>
<body>
     <div id="container">
          <p id="text">WHICH TYPE OF MEMBER ARE YOU TO THIS CLUB?</p>
          <a class="btn" href="participantSignIn.html"><span>I am a member/participant</span></a>
          <a class="btn" href="executiveSignIn.html"><span>I am an executive</span></a>
     </div>
</body>
</html>
